<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAUrted</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Mono&display=swap" rel="stylesheet">
</head>

<body>

  <div class="announce">
    <p>All the best for End sems!</p>
  </div>


  <nav>
    <div class="logo" onclick="gotoindex()">
      <span class="sau">SAU</span>rted
    </div>

    <div class="nav-links">
      <a href="about.html">About</a>
      <a href="contact.html">Feedback</a>
      <a href="https://forms.gle/N9vHCGRrw3EHNPnK7" target="_blank" class="submit">Contribute</a>
    </div>
  </nav>


  <section class="contact">
    
    <h1>Feedback</h1>
    <p class="sub">
      Found a broken link? Missing a paper? Have a suggestion? Let us know.
    </p>

    <form id="feedback-form">
      
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g. Rahul Sharma" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label for="type">Type of Feedback</label>
        <select id="type" required>
          <option value="">Select a category</option>
          <option>Broken link</option>
          <option>Missing paper</option>
          <option>Suggestion</option>
         <option>Other</option>
        </select>
     </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Describe the issue" required></textarea>
      </div>

    <button type="submit" class="submit-btn">Send Feedback</button>

  </form>

</section>




 
  
  <footer>
    <p>Queries and contributions</p><br>
    <a href="mailto:saurted@gmail.com">saurted@gmail.com</a>
  </footer>
  
  <script src="js/script.js"></script>

</body>
</html>
